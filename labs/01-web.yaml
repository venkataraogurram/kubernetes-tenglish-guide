# Lab 01: Deployment + ClusterIP Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-lab
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web                 # (1) ee label
  template:
    metadata:
      labels:
        app: web               # (2) ee label tho match avvali
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-lab
spec:
  type: ClusterIP
  selector:
    app: web                   # (3) idi kuda match avvali
  ports:
  - name: http
    port: 80
    targetPort: http
