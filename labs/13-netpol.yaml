# Lab 13: NetworkPolicy
# Prerequisite (EKS Auto Mode, cluster-level, okkasari): kube-system/amazon-vpc-cni ConfigMap lo
#   enable-network-policy-controller: "true"   (labs/README.md Lab 13 chudu)
# (1) k8s-lab lo anni pods ki ingress default deny
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: k8s-lab
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# (2) web pods ki role=frontend label unna pods nundi matrame port 80
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-frontend
  namespace: k8s-lab
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: frontend
    ports:
    - protocol: TCP
      port: 80
