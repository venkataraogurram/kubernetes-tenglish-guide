# Lab 02: init container + native sidecar + shared emptyDir
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  namespace: k8s-lab
  labels:
    app: init-demo
spec:
  initContainers:
  - name: wait-for-web               # web Service DNS resolve ayye varaku wait (Lab 01 apply chesi unte ventane pass)
    image: busybox:1.36
    command: ["sh", "-c", "until nslookup web.k8s-lab.svc.cluster.local; do echo waiting for web; sleep 2; done"]
  - name: log-tailer                 # native sidecar: restartPolicy Always
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "touch /shared/app.log; tail -f /shared/app.log"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo \"$(date) hello from $POD_NAME\" >> /shared/app.log; sleep 5; done"]
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    volumeMounts:
    - name: shared
      mountPath: /shared
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 32Mi }
  volumes:
  - name: shared
    emptyDir: {}
