# Lab 08: EKS Auto Mode EBS storage
# StorageClass cluster-level. Lab lo default class ga mark cheyyatledu (cluster default marchakunda).
# COST: 1Gi gp3 EBS volume create avthundi. Lab ayyaka PVC delete chesthe volume kuda delete (reclaimPolicy Delete).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lab-auto-ebs
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
allowedTopologies:
- matchLabelExpressions:
  - key: eks.amazonaws.com/compute-type
    values: ["auto"]
parameters:
  type: gp3
  encrypted: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: k8s-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: lab-auto-ebs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: k8s-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo \"$(date) written by $(hostname)\" >> /data/log.txt; cat /data/log.txt; sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 32Mi }
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
