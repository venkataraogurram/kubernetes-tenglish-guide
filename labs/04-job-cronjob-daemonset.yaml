# Lab 04: Job, CronJob, DaemonSet
apiVersion: batch/v1
kind: Job
metadata:
  name: pi-count
  namespace: k8s-lab
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 2
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo working on $(hostname); sleep 5; echo done"]
        resources:
          requests: { cpu: 10m, memory: 16Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: every-2-min
  namespace: k8s-lab
spec:
  schedule: "*/2 * * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: tick
            image: busybox:1.36
            command: ["sh", "-c", "date; echo cron tick"]
            resources:
              requests: { cpu: 10m, memory: 16Mi }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-hello
  namespace: k8s-lab
spec:
  selector:
    matchLabels:
      app: node-hello
  template:
    metadata:
      labels:
        app: node-hello
    spec:
      containers:
      - name: hello
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo running on node $NODE_NAME; sleep 60; done"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests: { cpu: 5m, memory: 8Mi }
          limits: { memory: 16Mi }
