# Lab 07: ConfigMap + Secret as env and as files
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8s-lab
data:
  APP_ENV: "dev"
  LOG_LEVEL: "info"
  app.properties: |
    greeting=Namaskaram
    feature.dark_mode=true
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: k8s-lab
type: Opaque
stringData:
  DB_PASSWORD: lab-only-not-a-real-password
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: k8s-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo \"env APP_ENV=$APP_ENV LOG_LEVEL=$LOG_LEVEL\"; echo \"file: $(cat /etc/app/app.properties | head -1)\"; sleep 15; done"]
    envFrom:
    - configMapRef:
        name: app-config
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
    volumeMounts:
    - name: config
      mountPath: /etc/app
      readOnly: true
    - name: secret
      mountPath: /etc/secret
      readOnly: true
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 32Mi }
  volumes:
  - name: config
    configMap:
      name: app-config
      items:
      - key: app.properties
        path: app.properties
  - name: secret
    secret:
      secretName: app-secret
