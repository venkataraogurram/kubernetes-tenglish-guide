apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8s-lab
nameSuffix: -prod
resources:
- ../../base
labels:
- pairs:
    env: prod
  includeSelectors: true
images:
- name: nginx
  newTag: "1.28"
patches:
- path: replicas-patch.yaml
configMapGenerator:
- name: kweb-config
  behavior: merge
  literals:
  - APP_ENV=prod
  - LOG_LEVEL=warn
