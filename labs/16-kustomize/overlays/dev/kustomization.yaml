apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8s-lab
nameSuffix: -dev
resources:
- ../../base
labels:
- pairs:
    env: dev
  includeSelectors: true   # selectors lo kuda env label, lekapothe dev/prod Services rendu deployments pods ni select chesthayi
configMapGenerator:
- name: kweb-config
  behavior: merge
  literals:
  - APP_ENV=dev
  - LOG_LEVEL=debug
